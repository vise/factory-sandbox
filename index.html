<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bill splitter</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #1a1a1a; background: #f7f7f5; }
      body { max-width: 28rem; margin: 3rem auto; padding: 0 1rem; }
      form { display: grid; gap: 0.75rem; }
      label { display: grid; gap: 0.25rem; font-weight: 600; }
      input { font: inherit; padding: 0.5rem; border: 1px solid #c8c8c2; border-radius: 0.375rem; }
      button { font: inherit; font-weight: 600; padding: 0.6rem; border: 0; border-radius: 0.375rem; background: #1a1a1a; color: #fff; cursor: pointer; }
      #error { color: #b3261e; min-height: 1.5rem; margin: 0.5rem 0; }
      #shares { padding-left: 1.25rem; }
    </style>
  </head>
  <body>
    <h1>Bill splitter</h1>
    <form id="split-form" novalidate>
      <label>Total <input id="total" name="total" inputmode="decimal" value="100.00" /></label>
      <label>People <input id="people" name="people" type="number" min="1" step="1" value="3" /></label>
      <label>Tip (%) <input id="tip" name="tip" type="number" min="0" max="100" step="1" value="10" /></label>
      <button type="submit">Split</button>
    </form>
    <p id="error" role="alert"></p>
    <ol id="shares" aria-label="Each person's share"></ol>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
